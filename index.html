<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 精灵蛋组遗传 · 内置数据</title>
    <style>
        /* ==================== CSS ==================== */
        :root {
            --primary: #5b7cfa;
            --primary-dark: #4a67d6;
            --primary-light: #e8edff;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --gray-100: #f7f8fc;
            --gray-200: #e9ecf2;
            --gray-300: #d1d6e0;
            --gray-500: #8e96a8;
            --gray-700: #4a5166;
            --gray-900: #1a1f2e;
            --radius: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.25s ease;
            --male-color: #4a90d9;
            --female-color: #e8688a;
            --stable-color: #2ecc71;
            --stable-bg: #eafaf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            padding: 16px 12px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-200);
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #8b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .app-header h1 small {
            -webkit-text-fill-color: initial;
            color: var(--gray-700);
            font-size: 12px;
            font-weight: 400;
            background: var(--gray-200);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 20px;
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .badge.success {
            background: #d4f5d9;
            color: #1a7a2e;
        }
        .badge.warning {
            background: #fff3d4;
            color: #b36b00;
        }
        .badge.info {
            background: #d4edff;
            color: #0066b3;
        }
        .badge.stable {
            background: var(--stable-bg);
            color: #1a7a2e;
            border: 1px solid var(--stable-color);
        }

        .card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 18px 20px;
            margin-bottom: 18px;
            transition: box-shadow var(--transition);
        }
        .card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-900);
            flex-wrap: wrap;
        }

        .card-title .step {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .card-title .toggle-btn {
            margin-left: auto;
            font-size: 12px;
            padding: 2px 10px;
            height: 26px;
            background: var(--gray-200);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: var(--gray-700);
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .card-title .toggle-btn:hover {
            background: var(--gray-300);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 140px;
            min-width: 110px;
            position: relative;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-700);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group label .required {
            color: var(--danger);
            font-weight: 700;
        }

        .form-group select,
        .form-group input {
            padding: 6px 10px;
            border: 1.5px solid var(--gray-300);
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
            width: 100%;
            color: var(--gray-900);
            height: 36px;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.15);
        }

        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .autocomplete-wrapper input {
            width: 100%;
        }

        .suggestions-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1.5px solid var(--gray-300);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: none;
            padding: 4px 0;
        }

        .suggestions-list .suggestion-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--gray-900);
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestions-list .suggestion-item:hover {
            background: var(--primary-light);
        }

        .suggestions-list .suggestion-item .group-hint {
            font-size: 11px;
            color: var(--gray-500);
            font-weight: 400;
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        .suggestions-list .suggestion-item .group-hint .tag {
            display: inline-block;
            background: var(--gray-200);
            padding: 0 6px;
            border-radius: 10px;
            font-size: 10px;
            color: var(--gray-700);
        }

        .suggestions-list .suggestion-item .group-hint .tag.undiscovered {
            background: #ffe4e4;
            color: #c0392b;
        }

        .suggestions-list .suggestion-item .group-hint .plus {
            color: var(--success);
            font-weight: 600;
        }

        .suggestions-list .suggestion-item .group-hint .minus {
            color: var(--danger);
            font-weight: 600;
        }

        .suggestions-list .no-match {
            padding: 10px 12px;
            color: var(--gray-500);
            font-size: 13px;
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), transform 0.1s, opacity var(--transition);
            white-space: nowrap;
            background: var(--gray-200);
            color: var(--gray-700);
            height: 36px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #2db84e;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #e0352b;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--gray-300);
            color: var(--gray-700);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-500);
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 11px;
            height: 26px;
        }

        .btn-icon {
            padding: 0 4px;
            height: 20px;
            min-width: 20px;
            font-size: 11px;
            background: transparent;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: var(--gray-500);
            transition: background 0.2s, color 0.2s;
        }
        .btn-icon:hover {
            background: var(--gray-200);
            color: var(--gray-900);
        }
        .btn-icon.danger:hover {
            background: #ffe4e4;
            color: var(--danger);
        }

        .data-status-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            background: var(--gray-100);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 4px;
        }

        .data-status-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--gray-700);
        }

        .data-status-bar .stat-item .num {
            font-weight: 700;
            color: var(--primary-dark);
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 4px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }

        thead {
            background: var(--gray-100);
            border-radius: 8px;
        }

        th {
            text-align: left;
            padding: 8px 10px;
            font-weight: 600;
            color: var(--gray-700);
            border-bottom: 2px solid var(--gray-200);
            font-size: 12px;
            white-space: nowrap;
            min-width: 60px;
        }

        th:nth-child(1) { min-width: 40px; }
        th:nth-child(2) { min-width: 80px; }
        th:nth-child(3) { min-width: 60px; }
        th:nth-child(4) { min-width: 70px; }
        th:nth-child(5) { min-width: 70px; }
        th:nth-child(6) { min-width: 100px; }
        th:nth-child(7) { min-width: 60px; }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--gray-200);
            vertical-align: middle;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .gender-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .gender-tag.male {
            background: #d4e4ff;
            color: var(--male-color);
        }
        .gender-tag.female {
            background: #ffe4ec;
            color: var(--female-color);
        }

        .medal-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: var(--gray-200);
            color: var(--gray-700);
            margin: 0 1px;
        }
        .medal-tag.body {
            background: #fff3d4;
            color: #b36b00;
        }
        .medal-tag.voice {
            background: #d4edff;
            color: #0066b3;
        }
        .medal-tag.none {
            background: var(--gray-100);
            color: var(--gray-500);
            font-weight: 400;
        }

        .nature-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: #e8e0ff;
            color: #6b4fa8;
            white-space: nowrap;
        }

        .nature-tag .eff {
            font-size: 9px;
            opacity: 0.7;
            margin-left: 2px;
        }
        .nature-tag .eff.plus {
            color: var(--success);
        }
        .nature-tag .eff.minus {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 24px 16px;
            color: var(--gray-500);
            font-size: 13px;
        }
        .empty-state .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 6px;
        }

        /* ===== 配对结果 ===== */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .result-item {
            background: var(--gray-100);
            border-radius: var(--radius);
            padding: 14px 16px;
            border-left: 4px solid var(--primary);
            transition: background var(--transition), border-color var(--transition);
        }
        .result-item:hover {
            background: #f0f3ff;
        }

        .result-item.stable-pair {
            border-left: 6px solid var(--stable-color);
            background: var(--stable-bg);
            box-shadow: 0 2px 12px rgba(46, 204, 113, 0.15);
            order: -1;
        }
        .result-item.stable-pair:hover {
            background: #d5f5e3;
        }

        .result-item .pair-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .result-item .pair-header .vs {
            color: var(--gray-500);
            font-weight: 400;
            font-size: 13px;
        }
        .result-item .pair-header .stable-badge {
            display: inline-block;
            background: var(--stable-color);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .result-item .pair-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
            font-size: 13px;
            color: var(--gray-700);
        }
        .result-item .pair-detail .label {
            color: var(--gray-500);
            font-weight: 500;
            margin-right: 3px;
        }

        .result-item .inherit {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px dashed var(--gray-300);
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            font-size: 13px;
        }
        .result-item .inherit .inherit-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .result-item .inherit .inherit-item .icon {
            font-size: 16px;
        }
        .result-item .inherit .inherit-item .val {
            font-weight: 600;
            color: var(--primary-dark);
        }
        .result-item .inherit .inherit-item .val.none {
            color: var(--gray-500);
            font-weight: 400;
        }

        .result-item .common-groups {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .result-item .common-groups .group-tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        /* ===== 筛选器 ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
            padding: 10px 14px;
            background: var(--gray-100);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .filter-bar .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--gray-700);
        }

        .filter-bar .filter-group select,
        .filter-bar .filter-group input {
            padding: 4px 8px;
            border: 1.5px solid var(--gray-300);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            outline: none;
            height: 32px;
        }
        .filter-bar .filter-group select:focus,
        .filter-bar .filter-group input:focus {
            border-color: var(--primary);
        }

        /* ===== 折叠控制 ===== */
        .list-collapsible {
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .list-collapsible.collapsed {
            display: none;
        }

        /* ===== 账号管理 ===== */
        .account-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            background: var(--gray-100);
            border-radius: 8px;
            padding: 6px 12px;
            margin-bottom: 14px;
        }

        .account-bar .current-account {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
            white-space: nowrap;
        }

        .account-bar .current-account span {
            color: var(--primary-dark);
            font-weight: 700;
        }

        .account-bar .account-input-group {
            display: flex;
            gap: 4px;
            flex: 0 1 auto;
            min-width: 140px;
        }

        .account-bar .account-input-group input {
            flex: 1 1 100px;
            padding: 4px 8px;
            border: 1.5px solid var(--gray-300);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
            height: 30px;
            min-width: 60px;
        }
        .account-bar .account-input-group input:focus {
            border-color: var(--primary);
        }

        .account-bar .account-input-group .btn {
            height: 30px;
            padding: 0 10px;
            font-size: 12px;
        }

        .account-bar .account-switch-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1 1 auto;
        }

        .account-bar .account-switch-group .account-tag {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 2px 6px 2px 8px;
            background: var(--gray-200);
            border-radius: 20px;
            font-size: 12px;
            color: var(--gray-700);
            cursor: default;
            transition: background 0.2s, color 0.2s;
            border: 1.5px solid transparent;
        }
        .account-bar .account-switch-group .account-tag .tag-name {
            cursor: pointer;
        }
        .account-bar .account-switch-group .account-tag .tag-name:hover {
            text-decoration: underline;
        }
        .account-bar .account-switch-group .account-tag.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-dark);
            font-weight: 600;
        }
        .account-bar .account-switch-group .account-tag .tag-actions {
            display: flex;
            gap: 1px;
            margin-left: 2px;
        }
        .account-bar .account-switch-group .account-tag .tag-actions .btn-icon {
            font-size: 10px;
            padding: 0 2px;
            height: 18px;
            min-width: 18px;
            color: var(--gray-500);
        }
        .account-bar .account-switch-group .account-tag .tag-actions .btn-icon:hover {
            background: var(--gray-300);
            color: var(--gray-900);
        }
        .account-bar .account-switch-group .account-tag .tag-actions .btn-icon.danger:hover {
            background: #ffe4e4;
            color: var(--danger);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 340px;
            background: var(--gray-900);
            color: #fff;
            padding: 12px 18px;
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            background: var(--success);
            color: #fff;
        }
        .toast.error {
            background: var(--danger);
            color: #fff;
        }
        .toast.warning {
            background: var(--warning);
            color: #fff;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .card {
                padding: 12px 14px 16px;
            }
            .form-row {
                gap: 10px;
            }
            .form-group {
                flex: 1 1 100%;
                min-width: unset;
            }
            .form-group select,
            .form-group input {
                font-size: 14px;
                height: 40px;
            }
            .result-item .pair-header {
                font-size: 13px;
            }
            .result-item .pair-detail,
            .result-item .inherit {
                flex-direction: column;
                gap: 4px;
            }
            .data-status-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar .filter-group {
                flex-wrap: wrap;
            }
            .card-title .toggle-btn {
                margin-left: 0;
            }

            /* 移动端账号栏优化 */
            .account-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 8px 10px;
                gap: 6px;
            }
            .account-bar .current-account {
                font-size: 13px;
                text-align: center;
            }
            .account-bar .account-input-group {
                flex-wrap: wrap;
                gap: 4px;
            }
            .account-bar .account-input-group input {
                flex: 1 1 100%;
                min-width: 80px;
                height: 34px;
                font-size: 14px;
            }
            .account-bar .account-input-group .btn {
                flex: 0 0 auto;
                height: 34px;
                font-size: 13px;
                padding: 0 14px;
            }
            .account-bar .account-switch-group {
                justify-content: center;
                gap: 4px;
            }
            .account-bar .account-switch-group .account-tag {
                font-size: 12px;
                padding: 2px 6px 2px 8px;
            }

            /* 表格移动端优化 */
            .table-wrap {
                margin: 0 -4px;

        (function() {
            'use strict';

            // -------- DOM 引用 --------
            const $ = id => document.getElementById(id);
            const nameInput = $('pokemonNameInput');
            const pokemonSuggestions = $('pokemonSuggestionsList');
            const natureInput = $('natureInput');
            const natureSuggestions = $('natureSuggestionsList');
            const genderSelect = $('genderSelect');

            const voiceMedalSelect = $('voiceMedalSelect');

            const addBtn = $('addBtn');
            const pokemonTable = $('pokemonTable');

            const emptyList = $('emptyList');

            const analyzeBtn = $('analyzeBtn');
            const clearResultBtn = $('clearResultBtn');
            const resultGrid = $('resultGrid');
            const emptyResult = $('emptyResult');
            const resultBadge = $('resultBadge');
            const clearAllBtn = $('clearAllBtn');
            const toast = $('toast');
            const totalPokemonCount = $('totalPokemonCount');
            const totalGroupCount = $('totalGroupCount');
            const undiscoveredCount = $('undiscoveredCount');

            const searchName = $('searchName');

            // -------- 数据状态 --------
            let eggData = [];
            let nameList = [];

            let currentPairs = [];
            let listCollapsed = false;
            let currentAccount = 'default';
            let accountList = [];

            // -------- 存储键 --------
            const STORAGE_ACCOUNT_LIST = 'eggGeneticsAccountList';
            const STORAGE_PREFIX = 'eggGeneticsData_';

            // -------- 工具函数 --------
            function toastMessage(msg, type = 'info', duration = 2800) {
                toast.textContent = msg;
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                else if (type === 'error') toast.classList.add('error');
                else if (type === 'warning') toast.classList.add('warning');
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function genId() { return ++idCounter; }

            // -------- 账号管理 --------
            function loadAccountList() {
                try {
                    const data = localStorage.getItem(STORAGE_ACCOUNT_LIST);
                    if (data) {
                        accountList = JSON.parse(data);
                        if (!Array.isArray(accountList)) accountList = [];
                    } else {
                        accountList = ['default'];
                    }
                } catch (_) {
                    accountList = ['default'];
                }
                if (!accountList.includes('default')) {
                    accountList.unshift('default');
                }
                return accountList;
            }

            function saveAccountList() {
                try {
                    localStorage.setItem(STORAGE_ACCOUNT_LIST, JSON.stringify(accountList));
                } catch (_) { /* ignore */ }
            }

            function getAccountStorageKey(accountName) {
                return STORAGE_PREFIX + accountName;
            }

            function loadAccountData(accountName) {
                try {
                    const key = getAccountStorageKey(accountName);
                    const data = localStorage.getItem(key);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed && typeof parsed === 'object') {
                            return parsed;
                        }
                    }
                } catch (_) { /* ignore */ }
                return { pokemons: [], idCounter: 0 };
            }

            function saveAccountData(accountName, data) {
                try {
                    const key = getAccountStorageKey(accountName);
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (_) { /* ignore */ }
            }

            function deleteAccountData(accountName) {
                try {
                    const key = getAccountStorageKey(accountName);
                    localStorage.removeItem(key);
                } catch (_) { /* ignore */ }
            }

            function switchAccount(accountName) {
                if (accountName === currentAccount) return;
                const currentData = {
                    pokemons: userPokemons,
                    idCounter: idCounter
                };
                saveAccountData(currentAccount, currentData);

                const newData = loadAccountData(accountName);
                userPokemons = newData.pokemons || [];
                idCounter = newData.idCounter || 0;
                currentAccount = accountName;

                currentAccountName.textContent = accountName;
                renderPokemonList();
                updateResultBadge();
                clearResults();
                renderAccountTags();
                localStorage.setItem('eggGeneticsLastAccount', currentAccount);
                toastMessage(`已切换到账号：${accountName}`, 'success');
            }

            function addOrSwitchAccount(accountName) {
                accountName = accountName.trim();
                if (!accountName) {
                    toastMessage('请输入账号名称', 'warning');
                    return;
                }
                if (accountName.length > 20) {
                    toastMessage('账号名称不能超过20个字符', 'warning');
                    return;
                }
                if (accountList.includes(accountName)) {
                    if (accountName !== currentAccount) {
                        switchAccount(accountName);
                    } else {
                        toastMessage('已经是当前账号', 'info');
                    }
                    return;
                }
                accountList.push(accountName);
                saveAccountList();
                saveAccountData(accountName, { pokemons: [], idCounter: 0 });
                switchAccount(accountName);
                renderAccountTags();
                toastMessage(`已创建并切换到账号：${accountName}`, 'success');
                newAccountInput.value = '';
            }

            function renameAccount(oldName, newName) {
                newName = newName.trim();
                if (!newName) {
                    toastMessage('新名称不能为空', 'warning');
                    return false;
                }
                if (newName.length > 20) {
                    toastMessage('账号名称不能超过20个字符', 'warning');
                    return false;
                }
                if (newName === oldName) {
                    toastMessage('新名称与旧名称相同', 'info');
                    return false;
                }
                if (accountList.includes(newName)) {
                    toastMessage(`账号 "${newName}" 已存在`, 'warning');
                    return false;
                }
                const data = loadAccountData(oldName);
                deleteAccountData(oldName);
                saveAccountData(newName, data);
                const idx = accountList.indexOf(oldName);
                if (idx !== -1) {
                    accountList[idx] = newName;
                    saveAccountList();
                }
                if (currentAccount === oldName) {
                    currentAccount = newName;
                    currentAccountName.textContent = newName;
                    localStorage.setItem('eggGeneticsLastAccount', newName);
                }
                renderAccountTags();
                toastMessage(`账号已从 "${oldName}" 重命名为 "${newName}"`, 'success');
                return true;
            }

            function deleteAccount(accountName) {
                if (accountName === 'default') {
                    toastMessage('不能删除默认账号', 'warning');
                    return;
                }
                if (accountName === currentAccount) {
                    toastMessage('不能删除当前正在使用的账号', 'warning');
                    return;
                }
                if (!confirm(`确定要删除账号 "${accountName}" 及其所有精灵数据吗？`)) return;
                const idx = accountList.indexOf(accountName);
                if (idx !== -1) {
                    accountList.splice(idx, 1);
                    saveAccountList();
                }
                deleteAccountData(accountName);
                renderAccountTags();
                toastMessage(`已删除账号 "${accountName}"`, 'success');
            }

            function renderAccountTags() {
                accountSwitchGroup.innerHTML = '';
                for (const acc of accountList) {
                    const tag = document.createElement('span');
                    tag.className = 'account-tag' + (acc === currentAccount ? ' active' : '');
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'tag-name';
                    nameSpan.textContent = acc;
                    nameSpan.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.parentElement.dataset.account;
                        if (name !== currentAccount) {
                            switchAccount(name);
                        }
                    });
                    tag.dataset.account = acc;

                    const actions = document.createElement('span');
                    actions.className = 'tag-actions';

                    if (acc !== 'default') {
                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn-icon';
                        editBtn.innerHTML = '✏️';
                        editBtn.title = '重命名';
                        editBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const oldName = this.closest('.account-tag').dataset.account;
                            const newName = prompt('请输入新的账号名称：', oldName);
                            if (newName !== null) {
                                renameAccount(oldName, newName);
                            }
                        });
                        actions.appendChild(editBtn);

                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn-icon danger';
                        delBtn.innerHTML = '❌';
                        delBtn.title = '删除';
                        delBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const name = this.closest('.account-tag').dataset.account;
                            deleteAccount(name);
                        });
                        actions.appendChild(delBtn);
                    }

                    tag.appendChild(nameSpan);
                    tag.appendChild(actions);
                    accountSwitchGroup.appendChild(tag);
                }
            }

            // -------- 数据初始化 --------
            function initEggData() {
                const map = new Map();
                for (const item of EMBEDDED_DATA) {
                    const name = item[0];
                    const groups = item.slice(1);
                    if (map.has(name)) {
                        const existing = map.get(name);
                        for (const g of groups) {
                            if (!existing.includes(g)) existing.push(g);
                        }
                    } else {
                        map.set(name, [...groups]);
                    }
                }
                eggData = [];
                for (const [name, groups] of map) {
                    eggData.push({ name, groups });
                }
                nameList = eggData.map(d => d.name).sort();
                return eggData;
            }

            function getPokemonGroups(name) {
                const found = eggData.find(d => d.name === name);
                return found ? found.groups : [];
            }

            function getNatureInfo(name) {
                return NATURE_MAP[name] || null;
            }

            function updateStats() {
                totalPokemonCount.textContent = eggData.length;
                const allGroups = new Set();
                let undiscovered = 0;
                for (const d of eggData) {
                    for (const g of d.groups) {
                        allGroups.add(g);
                    }
                    if (d.groups.includes('未发现')) undiscovered++;
                }
                totalGroupCount.textContent = allGroups.size;
                undiscoveredCount.textContent = undiscovered;
            }

            function loadCurrentAccount() {
                let lastAccount = localStorage.getItem('eggGeneticsLastAccount');
                if (lastAccount && accountList.includes(lastAccount)) {
                    currentAccount = lastAccount;
                } else {
                    currentAccount = 'default';
                }
                const data = loadAccountData(currentAccount);
                userPokemons = data.pokemons || [];
                idCounter = data.idCounter || 0;
                currentAccountName.textContent = currentAccount;
                renderAccountTags();
                renderPokemonList();
                updateResultBadge();
                clearResults();
            }

            function saveCurrentAccountData() {
                const data = {
                    pokemons: userPokemons,
                    idCounter: idCounter
                };
                saveAccountData(currentAccount, data);
                localStorage.setItem('eggGeneticsLastAccount', currentAccount);
            }

            function toggleList() {
                listCollapsed = !listCollapsed;
                if (listCollapsed) {
                    listCollapsible.classList.add('collapsed');
                    toggleListBtn.textContent = '▶ 展开';
                } else {
                    listCollapsible.classList.remove('collapsed');
                    toggleListBtn.textContent = '▼ 折叠';
                }
            }

            // ============================================================
            //  精灵名称自动补全
            // ============================================================
            let pokemonSuggestionIndex = -1;

            function renderPokemonSuggestions(filter) {
                const val = filter.trim().toLowerCase();
                if (val === '') {
                    pokemonSuggestions.style.display = 'none';
                    return;
                }
                const matches = nameList.filter(name => name.toLowerCase().includes(val));
                if (matches.length === 0) {
                    pokemonSuggestions.innerHTML = `<div class="no-match">😕 没有匹配的精灵</div>`;
                    pokemonSuggestions.style.display = 'block';
                    return;
                }
                const limited = matches.slice(0, 15);
                let html = '';
                for (const name of limited) {
                    const groups = getPokemonGroups(name);
                    const isUndiscovered = groups.includes('未发现');
                    const groupStr = groups.join(' · ');
                    html += `<div class="suggestion-item" data-name="${name}">
                                <span>${name}</span>
                                <span class="group-hint">
                                    ${groupStr}
                                    ${isUndiscovered ? '<span class="tag undiscovered">未发现</span>' : ''}
                                </span>
                            </div>`;
                }
                if (matches.length > 15) {
                    html += `<div class="no-match">⋯ 还有 ${matches.length - 15} 个匹配项</div>`;
                }
                pokemonSuggestions.innerHTML = html;
                pokemonSuggestions.style.display = 'block';
                pokemonSuggestionIndex = -1;
            }

            function selectPokemonSuggestion(name) {
                nameInput.value = name;
                pokemonSuggestions.style.display = 'none';
                nameInput.focus();
                nameInput.dispatchEvent(new Event('input'));
            }

            function highlightPokemonItem(items, idx) {
                items.forEach((el, i) => {
                    el.style.background = (i === idx) ? 'var(--primary-light)' : '';
                });
                if (idx >= 0 && idx < items.length) {
                    items[idx].scrollIntoView({ block: 'nearest' });
                }
            }

            nameInput.addEventListener('input', function() {
                renderPokemonSuggestions(this.value);
            });

            nameInput.addEventListener('keydown', function(e) {
                const items = pokemonSuggestions.querySelectorAll('.suggestion-item');
                if (items.length === 0) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    pokemonSuggestionIndex = Math.min(pokemonSuggestionIndex + 1, items.length - 1);
                    highlightPokemonItem(items, pokemonSuggestionIndex);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    pokemonSuggestionIndex = Math.max(pokemonSuggestionIndex - 1, -1);
                    highlightPokemonItem(items, pokemonSuggestionIndex);
                } else if (e.key === 'Enter') {
                    if (pokemonSuggestionIndex >= 0 && pokemonSuggestionIndex < items.length) {
                        e.preventDefault();
                        const name = items[pokemonSuggestionIndex].dataset.name;
                        selectPokemonSuggestion(name);
                    }
                } else if (e.key === 'Escape') {
                    pokemonSuggestions.style.display = 'none';
                }
            });

            pokemonSuggestions.addEventListener('click', function(e) {
                const item = e.target.closest('.suggestion-item');
                if (item) {
                    selectPokemonSuggestion(item.dataset.name);
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#pokemonNameInput') && !e.target.closest('#pokemonSuggestionsList')) {
                    pokemonSuggestions.style.display = 'none';
                }
            });

            nameInput.addEventListener('blur', function() {
                setTimeout(() => { pokemonSuggestions.style.display = 'none'; }, 200);
            });

            // ============================================================
            //  性格自动补全
            // ============================================================
            let natureSuggestionIndex = -1;

            function renderNatureSuggestions(filter) {
                const val = filter.trim().toLowerCase();
                if (val === '') {
                    natureSuggestions.style.display = 'none';
                    return;
                }
                const matches = NATURE_NAME_LIST.filter(name => name.toLowerCase().includes(val));
                if (matches.length === 0) {
                    natureSuggestions.innerHTML = `<div class="no-match">😕 没有匹配的性格</div>`;
                    natureSuggestions.style.display = 'block';
                    return;
                }
                const limited = matches.slice(0, 15);
                let html = '';
                for (const name of limited) {
                    const info = getNatureInfo(name);
                    if (!info) continue;
                    html += `<div class="suggestion-item" data-name="${name}">
                                <span>${name}</span>
                                <span class="group-hint">
                                    <span class="plus">${info.plus}</span>
                                    <span class="minus">${info.minus}</span>
                                </span>
                            </div>`;
                }
                if (matches.length > 15) {
                    html += `<div class="no-match">⋯ 还有 ${matches.length - 15} 个匹配项</div>`;
                }
                natureSuggestions.innerHTML = html;
                natureSuggestions.style.display = 'block';
                natureSuggestionIndex = -1;
            }

            function selectNatureSuggestion(name) {
                natureInput.value = name;
                natureSuggestions.style.display = 'none';
                natureInput.focus();
                natureInput.dispatchEvent(new Event('input'));
            }

            function highlightNatureItem(items, idx) {
                items.forEach((el, i) => {
                    el.style.background = (i === idx) ? 'var(--primary-light)' : '';
                });
                if (idx >= 0 && idx < items.length) {
                    items[idx].scrollIntoView({ block: 'nearest' });
                }
            }

            natureInput.addEventListener('input', function() {
                renderNatureSuggestions(this.value);
            });

            natureInput.addEventListener('keydown', function(e) {
                const items = natureSuggestions.querySelectorAll('.suggestion-item');
                if (items.length === 0) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    natureSuggestionIndex = Math.min(natureSuggestionIndex + 1, items.length - 1);
                    highlightNatureItem(items, natureSuggestionIndex);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    natureSuggestionIndex = Math.max(natureSuggestionIndex - 1, -1);
                    highlightNatureItem(items, natureSuggestionIndex);
                } else if (e.key === 'Enter') {
                    if (natureSuggestionIndex >= 0 && natureSuggestionIndex < items.length) {
                        e.preventDefault();
                        const name = items[natureSuggestionIndex].dataset.name;
                        selectNatureSuggestion(name);
                    }
                } else if (e.key === 'Escape') {
                    natureSuggestions.style.display = 'none';
                }
            });

            natureSuggestions.addEventListener('click', function(e) {
                const item = e.target.closest('.suggestion-item');
                if (item) {
                    selectNatureSuggestion(item.dataset.name);
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#natureInput') && !e.target.closest('#natureSuggestionsList')) {
                    natureSuggestions.style.display = 'none';
                }
            });

            natureInput.addEventListener('blur', function() {
                setTimeout(() => { natureSuggestions.style.display = 'none'; }, 200);
            });

            // ============================================================
            //  渲染精灵列表
            // ============================================================
            function renderPokemonList() {
                const tbody = pokemonTableBody;
                if (userPokemons.length === 0) {
                    pokemonTable.style.display = 'none';
                    emptyList.style.display = 'block';
                    listCount.textContent = '0 只';
                    return;
                }
                pokemonTable.style.display = 'table';
                emptyList.style.display = 'none';
                listCount.textContent = userPokemons.length + ' 只';

                tbody.innerHTML = '';
                userPokemons.forEach((p, idx) => {
                    const tr = document.createElement('tr');
                    const genderLabel = p.gender === '公' ? '♂ 公' : '♀ 母';
                    const genderClass = p.gender === '公' ? 'male' : 'female';

                    const bodyTag = p.bodyMedal === '无' ?
                        '<span class="medal-tag none">无</span>' :
                        `<span class="medal-tag body">${p.bodyMedal}</span>`;

                    const voiceTag = p.voiceMedal === '无' ?
                        '<span class="medal-tag none">无</span>' :
                        `<span class="medal-tag voice">${p.voiceMedal}</span>`;

                    let natureHtml = '';
                    if (p.nature && p.nature.trim()) {
                        const info = getNatureInfo(p.nature.trim());
                        if (info) {
                            natureHtml =
                                `<span class="nature-tag">${p.nature} <span class="eff plus">${info.plus}</span><span class="eff minus">${info.minus}</span></span>`;
                        } else {
                            natureHtml = `<span class="nature-tag">${p.nature}</span>`;
                        }
                    } else {
                        natureHtml = '<span class="medal-tag none">未设定</span>';
                    }

                    tr.innerHTML = `
                                <td>${idx + 1}</td>
                                <td><strong>${p.name}</strong></td>
                                <td><span class="gender-tag ${genderClass}">${genderLabel}</span></td>
                                <td>${bodyTag}</td>
                                <td>${voiceTag}</td>
                                <td>${natureHtml}</td>
                                <td style="text-align:center;">
                                    <button class="btn btn-danger btn-sm" data-id="${p.id}">删除</button>
                                </td>
                            `;
                    tbody.appendChild(tr);
                });

                tbody.querySelectorAll('[data-id]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id, 10);
                        deletePokemon(id);
                    });
                });
            }

            function deletePokemon(id) {
                userPokemons = userPokemons.filter(p => p.id !== id);
                saveCurrentAccountData();
                renderPokemonList();
                updateResultBadge();
                clearResults();
                toastMessage('已删除该精灵', 'success');
            }

            function clearAllPokemons() {
                if (userPokemons.length === 0) {
                    toastMessage('没有精灵需要清除', 'warning');
                    return;
                }
                if (!confirm(`确定要清除当前账号 "${currentAccount}" 中的所有精灵吗？`)) return;
                userPokemons = [];
                idCounter = 0;
                saveCurrentAccountData();
                renderPokemonList();
                clearResults();
                updateResultBadge();
                toastMessage(`已清空账号 ${currentAccount} 的所有精灵`, 'success');
            }

            function clearResults() {
                currentPairs = [];
                resultGrid.style.display = 'none';
                emptyResult.style.display = 'block';
                resultBadge.textContent = '待分析';
                resultBadge.className = 'badge';
                filterBar.style.display = 'none';
            }

            function updateResultBadge() {
                if (userPokemons.length === 0) {
                    resultBadge.textContent = '无精灵';
                    resultBadge.className = 'badge warning';
                    return;
                }
                const males = userPokemons.filter(p => p.gender === '公').length;
                const females = userPokemons.filter(p => p.gender === '母').length;
                if (males === 0 || females === 0) {
                    resultBadge.textContent = `♂${males} ♀${females} 需公母各至少一只`;
                    resultBadge.className = 'badge warning';
                } else {
                    resultBadge.textContent = `♂${males} ♀${females} 可分析`;
                    resultBadge.className = 'badge success';
                }
            }

            // ============================================================
            //  核心配对分析（奖牌必须完全相同）
            // ============================================================
            function analyzePairs() {
                const males = userPokemons.filter(p => p.gender === '公');
                const females = userPokemons.filter(p => p.gender === '母');

                if (males.length === 0 || females.length === 0) {
                    return { pairs: [], message: '需要至少一只公精灵和一只母精灵才能配对。' };
                }

                const results = [];

                for (const male of males) {
                    for (const female of females) {
                        if (male.id === female.id) continue;

                        const maleGroups = getPokemonGroups(male.name);
                        const femaleGroups = getPokemonGroups(female.name);

                        if (maleGroups.includes('未发现') || femaleGroups.includes('未发现')) continue;

                        const common = maleGroups.filter(g => femaleGroups.includes(g));
                        if (common.length === 0) continue;

                        // 奖牌必须完全相同（包括“无”）
                        if (male.bodyMedal !== female.bodyMedal || male.voiceMedal !== female.voiceMedal) continue;

                        // 遗传奖牌：只有双方非“无”且相等时才遗传
                        let inheritBody = null;
                        if (male.bodyMedal !== '无' && female.bodyMedal !== '无' && male.bodyMedal === female.bodyMedal) {
                            inheritBody = male.bodyMedal;
                        }
                        let inheritVoice = null;
                        if (male.voiceMedal !== '无' && female.voiceMedal !== '无' && male.voiceMedal === female.voiceMedal) {
                            inheritVoice = male.voiceMedal;
                        }

                        // 性格遗传
                        let inheritNature = null;
                        if (male.nature && female.nature && male.nature.trim() === female.nature.trim() && male.nature
                            .trim() !== '') {
                            inheritNature = male.nature.trim();
                        }

                        results.push({
                            male: male,
                            female: female,
                            commonGroups: common,
                            inheritBody: inheritBody,
                            inheritVoice: inheritVoice,
                            inheritNature: inheritNature,
                            isStable: (inheritNature !== null)
                        });
                    }
                }

                return { pairs: results, message: results.length === 0 ? '没有找到奖牌完全相同的配对组合。' : null };
            }

            // ============================================================
            //  渲染配对结果
            // ============================================================
            function renderResults(pairs) {
                if (pairs.length === 0) {
                    emptyResult.style.display = 'block';
                    resultGrid.style.display = 'none';
                    resultBadge.textContent = '无配对';
                    resultBadge.className = 'badge warning';
                    emptyResult.querySelector('.icon').textContent = '🔍';
                    emptyResult.innerHTML = `<span class="icon">🔍</span>没有找到奖牌完全相同的配对。<br><span class="text-muted">请确保公母精灵有相同的蛋组且两种奖牌都相同（非"未发现"）。</span>`;
                    filterBar.style.display = 'none';
                    return;
                }

                // 按稳定遗传优先排序
                const sorted = [...pairs].sort((a, b) => (b.isStable ? 1 : 0) - (a.isStable ? 1 : 0));

                // 应用筛选
                const type = filterType.value;
                const search = searchName.value.trim().toLowerCase();
                let filtered = sorted;
                if (type === 'stable') {
                    filtered = filtered.filter(p => p.isStable);
                }
                if (search) {
                    filtered = filtered.filter(p =>
                        p.male.name.toLowerCase().includes(search) ||
                        p.female.name.toLowerCase().includes(search)
                    );
                }

                if (filtered.length === 0) {
                    emptyResult.style.display = 'block';
                    resultGrid.style.display = 'none';
                    resultBadge.textContent = '无匹配';
                    resultBadge.className = 'badge warning';
                    emptyResult.querySelector('.icon').textContent = '🔍';
                    emptyResult.innerHTML = `<span class="icon">🔍</span>没有匹配筛选条件的配对。`;
                    filterBar.style.display = 'flex';
                    return;
                }

                resultBadge.textContent = `${filtered.length} 个配对${filtered.some(p => p.isStable) ? ' ⭐ 含稳定遗传' : ''}`;
                resultBadge.className = 'badge success';
                emptyResult.style.display = 'none';
                resultGrid.style.display = 'grid';
                resultGrid.innerHTML = '';
                filterBar.style.display = 'flex';

                for (const pair of filtered) {
                    const div = document.createElement('div');
                    div.className = 'result-item' + (pair.isStable ? ' stable-pair' : '');

                    const male = pair.male;
                    const female = pair.female;

                    const bodyInherit = pair.inheritBody ?
                        `<span class="val">${pair.inheritBody}</span>` :
                        '<span class="val none">无</span>';
                    const voiceInherit = pair.inheritVoice ?
                        `<span class="val">${pair.inheritVoice}</span>` :
                        '<span class="val none">无</span>';
                    const natureInherit = pair.inheritNature ?
                        `<span class="val">${pair.inheritNature}</span>` :
                        '<span class="val none">无</span>';

                    const groupsHtml = pair.commonGroups.map(g =>
                        `<span class="group-tag">${g}</span>`
                    ).join('');

                    const maleNatureInfo = male.nature ? getNatureInfo(male.nature) : null;
                    const femaleNatureInfo = female.nature ? getNatureInfo(female.nature) : null;
                    const maleNatureStr = maleNatureInfo ?
                        `${male.nature} (${maleNatureInfo.plus} ${maleNatureInfo.minus})` :
                        (male.nature || '无');
                    const femaleNatureStr = femaleNatureInfo ?
                        `${female.nature} (${femaleNatureInfo.plus} ${femaleNatureInfo.minus})` :
                        (female.nature || '无');

                    const stableBadge = pair.isStable ?
                        `<span class="stable-badge">⭐ 稳定遗传</span>` :
                        '';

                    div.innerHTML = `
                                <div class="pair-header">
                                    <span>${male.name} <span class="gender-tag male">♂ 公</span></span>
                                    <span class="vs">×</span>
                                    <span>${female.name} <span class="gender-tag female">♀ 母</span></span>
                                    ${stableBadge}
                                    <span style="font-weight:400;font-size:12px;color:var(--gray-500);">
                                        共同蛋组: <span class="common-groups">${groupsHtml}</span>
                                    </span>
                                </div>
                                <div class="pair-detail">
                                    <div><span class="label">♂</span> ${male.name} 
                                        ${male.bodyMedal !== '无' ? '🧍' + male.bodyMedal : ''} 
                                        ${male.voiceMedal !== '无' ? '🔊' + male.voiceMedal : ''} 
                                        ${maleNatureInfo ? '💭' + maleNatureStr : ''}
                                    </div>
                                    <div><span class="label">♀</span> ${female.name} 
                                        ${female.bodyMedal !== '无' ? '🧍' + female.bodyMedal : ''} 
                                        ${female.voiceMedal !== '无' ? '🔊' + female.voiceMedal : ''} 
                                        ${femaleNatureInfo ? '💭' + femaleNatureStr : ''}
                                    </div>
                                </div>
                                <div class="inherit">
                                    <div class="inherit-item">
                                        <span class="icon">🧍</span>
                                        体型奖牌: ${bodyInherit}
                                    </div>
                                    <div class="inherit-item">
                                        <span class="icon">🔊</span>
                                        声音奖牌: ${voiceInherit}
                                    </div>
                                    <div class="inherit-item">
                                        <span class="icon">💭</span>
                                        性格: ${natureInherit}
                                    </div>
                                </div>
                            `;
                    resultGrid.appendChild(div);
                }
            }

            // ============================================================
            //  执行分析
            // ============================================================
            function performAnalysis() {
                if (userPokemons.length === 0) {
                    toastMessage('请先添加精灵', 'warning');
                    return;
                }
                const males = userPokemons.filter(p => p.gender === '公');
                const females = userPokemons.filter(p => p.gender === '母');
                if (males.length === 0 || females.length === 0) {
                    toastMessage('需要至少一只公精灵和一只母精灵才能配对', 'warning');
                    return;
                }

                const result = analyzePairs();
                if (result.message) {
                    currentPairs = [];
                    renderResults([]);
                    toastMessage(result.message, 'warning');
                    return;
                }

                currentPairs = result.pairs;
                renderResults(currentPairs);
                toastMessage(`找到 ${result.pairs.length} 个奖牌完全相同的配对`, 'success');
            }

            // ============================================================
            //  添加精灵
            // ============================================================
            function addPokemon(e) {
                e.preventDefault();
                const name = nameInput.value.trim();
                const gender = genderSelect.value;
                const bodyMedal = bodyMedalSelect.value;
                const voiceMedal = voiceMedalSelect.value;
                const nature = natureInput.value.trim();

                if (!name) {
                    toastMessage('请输入或选择精灵名称', 'warning');
                    nameInput.focus();
                    return;
                }

                if (!nature) {
                    toastMessage('请填写性格（必填）', 'warning');
                    natureInput.focus();
                    return;
                }

                const groups = getPokemonGroups(name);
                if (groups.length === 0) {
                    toastMessage(`未找到名为 "${name}" 的精灵，请从建议中选择`, 'warning');
                    nameInput.focus();
                    return;
                }

                const info = getNatureInfo(nature);
                if (!info) {
                    toastMessage(`未找到名为 "${nature}" 的性格，请从建议中选择`, 'warning');
                    natureInput.focus();
                    return;
                }

                const exists = userPokemons.some(p =>
                    p.name === name &&
                    p.gender === gender &&
                    p.bodyMedal === bodyMedal &&
                    p.voiceMedal === voiceMedal &&
                    p.nature === nature
                );
                if (exists) {
                    toastMessage(`已存在完全相同的精灵（${name}，${gender}，${bodyMedal}，${voiceMedal}，${nature}），请勿重复添加`, 'warning');
                    return;
                }

                if (groups.includes('未发现')) {
                    toastMessage(`⚠️ ${name} 属于「未发现」组，无法参与生蛋`, 'warning');
                }

                const newPokemon = {
                    id: genId(),
                    name: name,
                    gender: gender,
                    bodyMedal: bodyMedal,
                    voiceMedal: voiceMedal,
                    nature: nature
                };

                userPokemons.push(newPokemon);
                saveCurrentAccountData();
                renderPokemonList();
                updateResultBadge();
                clearResults();

                nameInput.value = '';
                natureInput.value = '';
                nameInput.focus();

                toastMessage(`✅ 已添加 ${gender}性 ${name}（${bodyMedal}，${voiceMedal}，${nature}）`, 'success');
                pokemonSuggestions.style.display = 'none';
                natureSuggestions.style.display = 'none';
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                initEggData();
                updateStats();

                loadAccountList();
                loadCurrentAccount();

                toggleListBtn.addEventListener('click', toggleList);

                addForm.addEventListener('submit', addPokemon);
                analyzeBtn.addEventListener('click', performAnalysis);

                clearResultBtn.addEventListener('click', function() {
                    clearResults();
                    toastMessage('已清除结果', 'info');
                });

                clearAllBtn.addEventListener('click', clearAllPokemons);

                filterType.addEventListener('change', function() {
                    if (currentPairs.length > 0) renderResults(currentPairs);
                });
                searchName.addEventListener('input', function() {
                    if (currentPairs.length > 0) renderResults(currentPairs);
                });

                addAccountBtn.addEventListener('click', function() {
                    const name = newAccountInput.value.trim();
                    addOrSwitchAccount(name);
                });
                newAccountInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const name = this.value.trim();
                        addOrSwitchAccount(name);
                        e.preventDefault();
                    }
                });

                nameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        if (pokemonSuggestions.style.display === 'block' && pokemonSuggestionIndex >= 0) {
                            const items = pokemonSuggestions.querySelectorAll('.suggestion-item');
                            if (pokemonSuggestionIndex < items.length) {
                                selectPokemonSuggestion(items[pokemonSuggestionIndex].dataset.name);
                                e.preventDefault();
                                return;
                            }
                        }
                        if (this.value.trim()) {
                            addForm.dispatchEvent(new Event('submit'));
                            e.preventDefault();
                        }
                    }
                });

                natureInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        if (natureSuggestions.style.display === 'block' && natureSuggestionIndex >= 0) {
                            const items = natureSuggestions.querySelectorAll('.suggestion-item');
                            if (natureSuggestionIndex < items.length) {
                                selectNatureSuggestion(items[natureSuggestionIndex].dataset.name);
                                e.preventDefault();
                                return;
                            }
                        }
                        if (this.value.trim()) {
                            const info = getNatureInfo(this.value.trim());
                            if (info) {
                                addForm.dispatchEvent(new Event('submit'));
                                e.preventDefault();
                            }
                        }
                    }
                });

                toastMessage(`✅ 已加载 ${eggData.length} 个精灵数据，当前账号：${currentAccount}`, 'success', 2500);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
